name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64. macos-13 (Intel check) was dropped:
        # GitHub retired the macos-13 runner image, so the job queued
        # forever and blocked every run. Re-add an Intel leg when a
        # replacement image exists.
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: gitleaks scans the PR diff range, which a
          # depth-1 checkout cannot resolve (shallow boundary error).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run assets
      - run: npm run assets:check
      - run: npm run typecheck
      - run: npm run boundaries
      - run: npx vitest run
      - run: npm run build
      - run: npm run check:no-fakes
      - name: Gitleaks scan
        # once per run is enough (same content on every runner); macOS-only
        # also sidesteps the action's broken windows_x64 asset download.
        if: matrix.os == 'macos-latest'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke package (unsigned, no publish)
        run: npx electron-builder --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/

  smoke:
    # Stuck-run guard: Do "hello" through a slow fake provider must answer
    # within 30s and leave no running task behind (routes + footer included).
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: gitleaks scans the PR diff range, which a
          # depth-1 checkout cannot resolve (shallow boundary error).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run smoke
        timeout-minutes: 5
      - run: node e2e/visibility-copy.js
        timeout-minutes: 5
